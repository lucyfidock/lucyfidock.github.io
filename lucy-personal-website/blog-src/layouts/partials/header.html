<header class="sticky top-0 bg-light-wisteria-50 dark:bg-pale-slate-950 text-light-wisteria-600 shadow-lg shadow-light-wisteria-100 dark:shadow-stone-800 dark:text-light-wisteria-400 transition-colors">
  <div class="container mx-auto px-4 py-4">
    <nav class="flex items-center justify-between">
      <a href="/" class="text-4xl font-heading hover:text-light-wisteria-400 dark:hover:text-light-wisteria-600 transition-colors">
        LF.
      </a>

      <!-- Desktop navigation -->
      <div class="hidden md:block">
        <ul class="flex space-x-6 items-center">
          <li>
            <a href="/" class="px-3 py-2 rounded transition-colors font-sans hover:bg-light-wisteria-400 dark:hover:bg-light-wisteria-600">
              Home
            </a>
          </li>
          <li>
            <a href="/#/about" class="px-3 py-2 rounded transition-colors font-sans hover:bg-light-wisteria-400 dark:hover:bg-light-wisteria-600">
              About
            </a>
          </li>
          <li>
            <a href="/#/cv" class="px-3 py-2 rounded transition-colors font-sans hover:bg-light-wisteria-400 dark:hover:bg-light-wisteria-600">
              CV
            </a>
          </li>
          <li>
            <a href="/posts/" class="px-3 py-2 rounded transition-colors font-sans bg-gradient-to-b from-light-wisteria-600 to-light-wisteria-400 text-white dark:bg-light-wisteria-400 dark:text-pale-slate-950">
              Blog
            </a>
          </li>
          <li>
            <button onclick="toggleDarkMode()" class="p-2 rounded hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800 transition-colors">
              🌙
            </button>
          </li>
        </ul>
      </div>

      <!-- Mobile menu button -->
      <div class="block md:hidden">
        <button onclick="toggleMobileMenu()" class="inline-flex w-full justify-center gap-x-1.5 rounded-md bg-light-wisteria-100 dark:bg-pale-slate-900 px-3 py-2 text-sm font-semibold text-light-wisteria-600 dark:text-light-wisteria-400 hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800 transition-colors">
          Menu
          <svg class="-mr-1 ml-2 h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
        
        <!-- Mobile menu (hidden by default) -->
        <div id="mobile-menu" class="hidden absolute right-4 z-10 mt-2 w-40 origin-top-right rounded bg-light-wisteria-50 dark:bg-pale-slate-950 shadow-lg shadow-light-wisteria-100 dark:shadow-stone-800">
          <a href="/" class="block px-4 py-2 text-sm rounded transition-colors text-light-wisteria-600 dark:text-light-wisteria-400 hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800">Home</a>
          <a href="/#/about" class="block px-4 py-2 text-sm rounded transition-colors text-light-wisteria-600 dark:text-light-wisteria-400 hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800">About</a>
          <a href="/#/cv" class="block px-4 py-2 text-sm rounded transition-colors text-light-wisteria-600 dark:text-light-wisteria-400 hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800">CV</a>
          <a href="/posts/" class="block px-4 py-2 text-sm rounded transition-colors font-sans bg-gradient-to-b from-light-wisteria-600 to-light-wisteria-400 text-white">Blog</a>
          <button onclick="toggleDarkMode()" class="block w-full text-left px-4 py-2 text-sm rounded transition-colors hover:bg-light-wisteria-200 dark:hover:bg-pale-slate-800">Toggle Mode</button>
        </div>
      </div>
    </nav>
  </div>
</header>
